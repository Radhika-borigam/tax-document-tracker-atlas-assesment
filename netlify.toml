# Netlify config for the React frontend.
# `base` makes every path below relative to frontend/.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The app calls /api/... with relative URLs (see frontend/src/api.js). Netlify
# proxies those to the Render backend, so the browser only ever talks to one
# origin and there is no CORS involved. Replace the host with your Render URL.
[[redirects]]
  from = "/api/*"
  to = "https://tax-document-tracker-atlas-assesment.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: everything else serves index.html. Must come after /api/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
